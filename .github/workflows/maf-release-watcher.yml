name: MAF Release Watcher

on:
  schedule:
    - cron: '0 6 * * 4'   # Thursday 06:00 UTC (~08:00 Europe/Zurich) — aligned with MAF's .NET Thursday-morning ship cadence. Manual workflow_dispatch covers off-cadence releases.
  workflow_dispatch:        # Manual trigger anytime
    inputs:
      maf_version:
        description: 'Specific MAF version to process (leave blank for latest from NuGet)'
        required: false
        default: ''
      push_target:
        description: 'Override branch for watcher commits (dry-run). Leave blank for the default release-watcher/maf-<version> PR branch (the scaffold is opened as a PR, never pushed to main).'
        required: false
        default: ''

# Phase 3.3 — a run can never overlap itself (analyze-and-update pushes to main;
# an overlap could double-apply registry edits). cancel-in-progress is false so
# an in-flight real update is allowed to finish.
concurrency:
  group: maf-self-update-watcher
  cancel-in-progress: false

jobs:
  # Phase 3.1 — validate workflow_dispatch input BEFORE any privileged step
  # runs. The watcher has COPILOT_ASSIGN_PAT in scope on the main job; a
  # malformed `maf_version` would otherwise template into shell-interpreted
  # contexts downstream.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate maf_version input shape
        env:
          INPUT: ${{ inputs.maf_version }}
        run: |
          if [ -z "$INPUT" ]; then
            echo "No version input — will use latest stable from NuGet"
            exit 0
          fi
          if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid maf_version input shape: $INPUT (must be semver)"
            exit 1
          fi

      - name: Validate push_target input shape
        # Task 5.2 — push_target lets a maintainer dry-run analyze-and-update
        # against a throwaway branch. Validate it's a plausible branch name
        # (defense-in-depth; it's also env-redirected at the push site).
        env:
          PT: ${{ inputs.push_target }}
        run: |
          if [ -z "$PT" ]; then exit 0; fi
          if ! echo "$PT" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid push_target: $PT (branch-name characters only)"
            exit 1
          fi

  check-for-new-maf-release:
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version-check.outputs.new_version }}
      old_version: ${{ steps.version-check.outputs.old_version }}
      has_update: ${{ steps.version-check.outputs.has_update }}
      is_major: ${{ steps.version-check.outputs.is_major }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check NuGet for new MAF version
        id: version-check
        # Phase 3.2 — read inputs via env: redirect; reference $INPUT_VERSION as
        # a shell variable. Eliminates template-injection surface in the script.
        env:
          INPUT_VERSION: ${{ inputs.maf_version }}
        run: |
          # Use explicit version if provided, otherwise query NuGet (latest STABLE)
          if [ -n "$INPUT_VERSION" ]; then
            LATEST="$INPUT_VERSION"
            echo "Using manually specified version: $LATEST"
          else
            # Filter out prereleases (`-alpha`, `-beta`, `-rc`, `-preview`) — we only
            # auto-process stable releases. Manual override above is the path for prereleases.
            # Retry 3× with backoff to ride out transient NuGet rate-limiting.
            for attempt in 1 2 3; do
              RAW=$(curl -sS --max-time 30 "https://api.nuget.org/v3-flatcontainer/microsoft.agents.ai/index.json" || true)
              if [ -n "$RAW" ]; then break; fi
              echo "NuGet query attempt $attempt failed, retrying after $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ -z "$RAW" ]; then
              echo "❌ NuGet API unreachable after 3 attempts — aborting cleanly."
              echo "has_update=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            # Filter to the latest STABLE version via a real module. Previously
            # this was an inline `python3 -c "..."` whose code carried this
            # shell block's indentation, so Python raised "IndentationError:
            # unexpected indent" on EVERY scheduled run (the explicit-version
            # dispatch path skips this branch, which is why manual runs worked).
            LATEST=$(echo "$RAW" | python3 .github/scripts/get_latest_stable.py)
            if [ -z "$LATEST" ]; then
              echo "ℹ️ No stable version found on NuGet — only prereleases. Skipping."
              echo "has_update=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Latest STABLE version on NuGet: $LATEST"
          fi

          CURRENT=$(cat .maf-version | tr -d '[:space:]')
          echo "Current tracked version: $CURRENT"

          echo "old_version=$CURRENT" >> $GITHUB_OUTPUT
          echo "new_version=$LATEST" >> $GITHUB_OUTPUT

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected: $CURRENT → $LATEST"

            # Detect major-version bump (semver MAJOR component changed).
            # `1.3.0 → 2.0.0` triggers escalated treatment; `1.3.0 → 1.4.0` does not.
            OLD_MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            NEW_MAJOR=$(echo "$LATEST" | cut -d. -f1)
            if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
              echo "is_major=true" >> $GITHUB_OUTPUT
              echo "🚨 MAJOR version bump: ${OLD_MAJOR}.x → ${NEW_MAJOR}.x — PR will be escalated."
            else
              echo "is_major=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "is_major=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No update. $CURRENT is current."
          fi

  analyze-and-update:
    needs: check-for-new-maf-release
    if: needs.check-for-new-maf-release.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write           # commit the watcher's auto-generated registry/guide updates
      pull-requests: write      # (reserved for future PR-based flow)
      issues: write             # Phase 3.2 — escalation issue for major bumps
      actions: write            # required for `gh workflow run maf-ai-fill-todos.yml` —
                                # without this the cross-workflow dispatch fails with
                                # HTTP 403 "Resource not accessible by integration".
                                # Discovered 2026-05-17 during live-fire test of MAF 1.6.1.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Use the maintainer's PAT (admin), not the workflow's GITHUB_TOKEN,
          # so the final `git push origin HEAD:main` can bypass branch
          # protection's required-status-check rule. Classic branch protection
          # (which this repo uses) has no bypass-list — only Rulesets do. But
          # admin users DO bypass when enforce_admins=False, and this PAT is
          # owned by the maintainer.
          #
          # Commit identity is still github-actions[bot] (set explicitly via
          # `git config` below). The PAT is only used for the push auth header.
          #
          # COPILOT_ASSIGN_PAT is a SHARED fine-grained PAT (this repo only). Its
          # FULL required scope — Issues + Contents + Pull requests + Actions R/W
          # — is documented in maf-ai-fill-todos.yml (which also uses it to assign
          # the Coding Agent). The watcher only exercises the Contents R/W portion
          # here (the push). Provision the full union, NOT Contents-only, or the
          # fill workflow's assignment breaks. Falls back to GITHUB_TOKEN if unset,
          # which will fail the push (loud, not silent). [task 3.5]
          token: ${{ secrets.COPILOT_ASSIGN_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          # Net8 LTS — install-only; we just run the published tool here.
          dotnet-version: '8.0.x'

      - name: Install dotnet-inspect
        run: |
          # Install dotnet-inspect directly as a global tool.
          #
          # Previously we used `dnx dotnet-inspect@0.7.8` as a one-off launcher,
          # but the `dnx` NuGet package was unlisted in 2026 — the cron failure
          # at 2026-05-11 was "dnx is not found in NuGet feeds". Direct install
          # of dotnet-inspect is the working path now and removes the dnx hop
          # entirely.
          dotnet tool install --global dotnet-inspect --version 0.7.8 \
            || dotnet tool update --global dotnet-inspect --version 0.7.8

      - name: Run diff — Microsoft.Agents.AI
        id: diff-core
        continue-on-error: true  # diff may fail if old version is too old
        # Phase 7.G fixup — `needs.*.outputs.*` now redirected via env: instead
        # of templated into the run: block. Same hardening pattern as Phase 3.2
        # applied to `inputs.*`. Eliminates the template-injection surface even
        # though the upstream values are already semver-validated.
        env:
          OLD: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: |
          dotnet-inspect diff \
            --package "Microsoft.Agents.AI@${OLD}..${NEW}" \
            --source https://api.nuget.org/v3/index.json \
            > diff-core.txt 2>&1 || true
          echo "Core diff output:"
          cat diff-core.txt

      - name: Run diff — Microsoft.Agents.AI.Workflows
        id: diff-workflows
        continue-on-error: true
        # Phase 7.G fixup — env-redirect (see diff-core above).
        env:
          OLD: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: |
          dotnet-inspect diff \
            --package "Microsoft.Agents.AI.Workflows@${OLD}..${NEW}" \
            --source https://api.nuget.org/v3/index.json \
            > diff-workflows.txt 2>&1 || true
          echo "Workflows diff output:"
          cat diff-workflows.txt

      - name: Fetch release notes
        id: release-notes
        continue-on-error: true
        # Phase 7.G fixup — env-redirect (see diff-core above). NOTE: this step
        # previously had TWO `env:` keys (NEW here + GH_TOKEN below) — a YAML
        # duplicate-key the GitHub workflow parser REJECTS (startup_failure: the
        # 0-second push runs), and which PyYAML silently tolerated by keeping the
        # LAST block, so `NEW` was dropped and release-notes fetched empty tags.
        # Merged into one block. [final-review fix]
        env:
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # MAF releases are on github.com/microsoft/agent-framework (NOT microsoft/agents).
          # MAF release tags follow the form `dotnet-X.Y.Z` (e.g. `dotnet-1.3.0`), per the
          # canonical release links in guides/maf-1.3.0-migration-guide.md.
          # Try both forms — `dotnet-X.Y.Z` first (canonical), `vX.Y.Z` as a fallback.
          for tag in "dotnet-${NEW}" "v${NEW}"; do
            if gh release view "$tag" --repo microsoft/agent-framework --json body --jq .body > release-notes.txt 2>/dev/null; then
              echo "✅ Fetched release notes from tag $tag"
              break
            fi
          done
          if [ ! -s release-notes.txt ]; then
            echo "ℹ️ Release notes not yet published on GitHub for $NEW — empty placeholder used." > release-notes.txt
          fi
          cat release-notes.txt

      - name: Update compatibility matrix
        env:
          OLD_VERSION: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: python3 .github/scripts/update_compat_matrix.py

      - name: Sync code compatibility matrix (CompatibilityTool.cs)
        # Green-on-arrival: add the matching CompatibilityTool.Matrix entry so the
        # doc<->code drift test is green on the scaffold PR, instead of red until a
        # human hand-edits the tool. Runs AFTER the matrix-doc step — it reads the
        # row that step just wrote.
        env:
          OLD_VERSION: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: python3 .github/scripts/sync_compat_tool.py

      - name: Generate draft guide section
        env:
          OLD_VERSION: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW_VERSION: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: python3 .github/scripts/gen_guide_section.py

      - name: Auto-append draft registry entries
        env:
          OLD: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        continue-on-error: true   # never block the PR on registry extraction
        run: |
          # Install maf-autopilot itself so we can call the registry-extract subcommand.
          dotnet tool install --global maf-doctor --prerelease \
            || dotnet tool update --global maf-doctor --prerelease

          REGISTRY=".github/skills/maf-obsolete-api-registry/registry.yaml"
          TMP_ENTRIES="/tmp/draft-registry-entries.yaml"

          # Run extractor for each MAF package — append concatenated output.
          : > "$TMP_ENTRIES"
          for pkg in Microsoft.Agents.AI Microsoft.Agents.AI.Workflows; do
            echo "=== Extracting draft entries for $pkg ($OLD → $NEW) ==="
            maf-doctor registry-extract "$pkg" "$OLD" "$NEW" >> "$TMP_ENTRIES" || true
            echo "" >> "$TMP_ENTRIES"
          done

          # Phase 3.4 — de-dupe extracted entries against the existing registry
          # BEFORE appending. Re-runs (or the daily cron re-detecting the same
          # version before .maf-version catches up) must not accrete duplicate
          # draft entries. The helper prints only entry blocks whose `id:` is not
          # already present (and de-dupes within the batch).
          NEW_ENTRIES=$(python3 .github/scripts/dedupe_registry_entries.py "$REGISTRY" "$TMP_ENTRIES")
          if [ -n "$NEW_ENTRIES" ]; then
            {
              echo ""
              echo "# === Draft entries auto-appended by release-watcher on $(date -u +%Y-%m-%d). Review before merging. ==="
              printf '%s\n' "$NEW_ENTRIES"
            } >> "$REGISTRY"
            echo "✅ Draft registry entries appended."
          else
            echo "ℹ️ No new draft registry candidates (all already present, or none extracted)."
          fi

      - name: Classify release (additive vs breaking)
        # Green-on-arrival verdict, decided in one place (release_classification):
        # additive ⇒ the scaffold is auto-filled and should be green; breaking ⇒
        # draft registry entries the keep-breaking-red gate holds red until filled.
        id: classify
        run: |
          VERDICT=$(python3 .github/scripts/release_classification.py)
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "::notice::MAF release classified as: $VERDICT"

      - name: Upload diff artifacts for reviewer
        # Make the raw diffs downloadable on the workflow run page so the human
        # reviewer can audit the breaking-change surface without re-running
        # dotnet-inspect locally. Cheap (~few KB), high signal-to-effort.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maf-diff-${{ needs.check-for-new-maf-release.outputs.new_version }}
          path: |
            diff-core.txt
            diff-workflows.txt
            release-notes.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Update .maf-version
        # Phase 7.G fixup — env-redirect needs.*.outputs.* (same pattern as
        # the diff-core / diff-workflows / release-notes steps above).
        env:
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: |
          echo "$NEW" > .maf-version
          echo "Updated .maf-version to $NEW"

      - name: Commit to a release-watcher branch and open a PR
        id: commit_to_main
        # Phase 3.2 — minor/patch bumps used to auto-commit straight to main; MAJOR
        # bumps escalate to a human (see the escalation step below).
        if: needs.check-for-new-maf-release.outputs.is_major != 'true'
        # C (2026-06-28): the scaffold carries TODO placeholders that `verify-registry`
        # (a build-test gate) deliberately REJECTS, so pushing it straight to main turned
        # main RED and blocked every downstream PR (incident: MAF 1.11.0, run 28153665314).
        # We now push to a per-version branch and open a PR — main only ever receives the
        # FILLED, build-green result on merge. This also restores the B.H2 review gate the
        # earlier direct-to-main mode removed. `push_target` still allows a dry-run branch.
        env:
          NEW_VERSION: ${{ needs.check-for-new-maf-release.outputs.new_version }}
          OLD_VERSION: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          IS_MAJOR: ${{ needs.check-for-new-maf-release.outputs.is_major }}
          VERDICT: ${{ steps.classify.outputs.verdict }}
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT || secrets.GITHUB_TOKEN }}
          PUSH_TARGET: ${{ inputs.push_target }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the paths the watcher is supposed to touch (artefacts like
          # diff-*.txt / release-notes.txt are uploaded separately, not committed).
          git add .maf-version \
                  docs/compatibility-matrix.md \
                  src/maf-autopilot/Tools/CompatibilityTool.cs \
                  guides/*.md \
                  .github/skills/maf-obsolete-api-registry/registry.yaml

          # Bail cleanly if every preceding step was a no-op.
          if git diff --cached --quiet; then
            echo "ℹ️ No watcher changes to commit — pipeline was a no-op."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Commit message via a Python helper (avoids the backtick-in-heredoc footgun
          # that aborted the watcher with exit 127 on 2026-05-17, run 25994841252).
          python3 .github/scripts/build_watcher_commit_message.py \
            > "$RUNNER_TEMP/commit-msg.txt"

          # Push to a per-version branch (NOT main) so an unfilled scaffold can never red
          # main. A manual dispatch may override the branch via push_target (dry-run).
          BRANCH="${PUSH_TARGET:-release-watcher/maf-${NEW_VERSION}}"
          # Hard guard: never operate on the default/protected branch. The whole point of C
          # is that the scaffold goes through a PR — a stray push_target=main must NOT push.
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "::error::push_target must not be a protected branch (got '$BRANCH'). The watcher opens a PR; it never pushes the scaffold to main."
            exit 1
          fi
          git checkout -b "$BRANCH"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # --force-with-lease (not -f): a rerun updates its own branch idempotently without
          # blindly clobbering remote updates pushed in between.
          git push --force-with-lease origin "HEAD:${BRANCH}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "committed=true" >> $GITHUB_OUTPUT

          # Open a PR to main (idempotent). NOTE: no backticks in the --body (double-quoted
          # bash would treat them as command substitution — see the 2026-05-17 incident).
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "✅ Updated existing PR for branch $BRANCH."
          else
            # Green-on-arrival: an ADDITIVE release is auto-filled and should be green;
            # a BREAKING release leaves draft TODOs the keep-breaking-red gate rejects.
            if [ "$VERDICT" = "additive" ]; then
              BODY="Auto-generated by the release watcher for MAF ${OLD_VERSION} -> ${NEW_VERSION}. Classified ADDITIVE (no .NET [BREAKING] notes and no removed members): the compatibility matrix, the code matrix (CompatibilityTool.cs), and the migration guide were filled deterministically, so this PR should be GREEN on arrival. Review the carried-forward pins + the new-member list, then merge. Raw API diffs are attached to the watcher run as artifacts."
            else
              BODY="Auto-generated by the release watcher for MAF ${OLD_VERSION} -> ${NEW_VERSION}. Classified BREAKING: the registry has draft entries whose migration text a human must write. The keep-breaking-red gate keeps this PR RED until the current-version drafts are filled — by design, so an unfilled scaffold can never reach main. To complete: fill the registry/guide TODOs (assign GitHub Copilot to the PR, or edit directly), confirm CI is green, then merge. Raw API diffs are attached to the watcher run as artifacts."
            fi
            gh pr create --base main --head "$BRANCH" \
              --title "chore: MAF ${NEW_VERSION} registry/matrix/guide update (${VERDICT})" \
              --body "$BODY"
            echo "✅ Opened PR for branch $BRANCH (${VERDICT})."
            # Label additive PRs so the auto-merge graduation (after a few proven
            # releases) can target them. Label ops are best-effort — never block.
            if [ "$VERDICT" = "additive" ]; then
              gh label create additive-auto-green --color 0E8A16 \
                --description "Watcher PR: additive release, scaffold auto-filled & green" 2>/dev/null || true
              gh pr edit "$BRANCH" --add-label additive-auto-green 2>/dev/null || true
            fi
          fi

      - name: Summarize next steps (fill the PR, then merge)
        if: ${{ steps.commit_to_main.outputs.committed == 'true' }}
        env:
          BRANCH: ${{ steps.commit_to_main.outputs.branch }}
          TARGET: ${{ needs.check-for-new-maf-release.outputs.new_version }}
        run: |
          # C (2026-06-28): we no longer auto-dispatch a SEPARATE Copilot fill PR off main.
          # That PR's workflows are approval-gated and historically stalled (incident: the
          # MAF 1.11.0 copilot/fill-todos PR sat unapproved for days). The scaffold now lives
          # on THIS run's PR branch — fill it there (assign GitHub Copilot to the PR, or edit
          # directly), confirm build-test is green, then merge. maf-ai-fill-todos.yml remains
          # available for manual use if you retarget it to the branch.
          echo "::notice::MAF $TARGET scaffold PR opened on branch $BRANCH — fill the registry/guide TODOs, confirm build-test is green, then merge."

      - name: Escalate MAJOR version bump for manual review
        # Phase 3.2 — major bumps (x.y → (x+1).0) carry the highest breaking-
        # change risk, so they are NOT auto-committed to main. Detect + diff
        # still ran (artifacts are attached to this run); here we open a single
        # tracking issue and let a human drive the migration. is_major flows via
        # env: redirect (ci-invariants job 4).
        if: needs.check-for-new-maf-release.outputs.is_major == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ needs.check-for-new-maf-release.outputs.new_version }}
          OLD: ${{ needs.check-for-new-maf-release.outputs.old_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create maf-release  --color 0E8A16 --force || true
          gh label create needs-review --color FBCA04 --force || true
          TITLE="🚨 MAJOR MAF bump ${OLD} → ${NEW} — manual review required"
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Major bump already tracked in issue #${NUM} — leaving as-is."
          else
            gh issue create --title "${TITLE}" --label "maf-release,needs-review" \
              --body "A new **major** MAF release was detected: \`${OLD}\` → \`${NEW}\`. Major bumps are not auto-committed to main (breaking-change risk). The breaking-API diffs are attached as artifacts on the run: ${RUN_URL}. To process: review the diffs, then dispatch the watcher manually for this version or apply the changes by hand."
            echo "Opened escalation issue for major bump ${OLD} → ${NEW}."
          fi

  # Phase 2.1 — surface ANY watcher failure as a GitHub notification. Scheduled
  # runs failed silently for ~5 weeks because the only signal was a red X in the
  # Actions tab. This opens (or de-dupes onto) a maf-release-labelled tracking
  # issue so the maintainer actually hears about it. github.* contexts flow via
  # env: redirect to satisfy ci-invariants job (4).
  notify-on-failure:
    needs: [validate-inputs, check-for-new-maf-release, analyze-and-update]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          gh label create maf-release --color 0E8A16 \
            --description "Auto-generated by maf-release-watcher / fill workflows" --force || true
          TITLE="🔴 Self-update workflow failed: ${WORKFLOW}"
          # Exact-title match (not --search, which is flaky on emoji) so repeat
          # failures update one rolling issue instead of spamming new ones.
          NUM=$(gh issue list --label maf-release --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Failed again: ${RUN_URL}"
            echo "Commented on existing failure issue #${NUM}"
          else
            gh issue create --title "${TITLE}" --label maf-release \
              --body "The scheduled **${WORKFLOW}** workflow failed. Most recent failed run: ${RUN_URL}. Updated (not duplicated) on subsequent failures; close once fixed."
            echo "Opened new failure issue"
          fi


