name: Release maf-autopilot

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.3.0-alpha-5). Leave blank to use version in csproj.'
        required: false
        default: ''
  push:
    tags:
      # Match BOTH canonical `v`-prefixed semver tags (`v1.3.0-alpha-5`) AND
      # tags that start with a digit directly (`1.3.0-alpha-5`). Without the
      # second pattern, releases tagged via GitHub's UI release-create flow
      # without a leading `v` silently fail to trigger the workflow — which
      # is exactly what happened to `1.3.0-alpha-4` and `1.3.0-alpha-5`.
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET (all three runtimes — nupkg multi-targets net8/9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using input version: $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Canonical: tag with `v` prefix (e.g. `v1.3.0-alpha-5`).
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using tag version (v-prefixed): $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/[0-9]* ]]; then
            # Tolerant: tag starts with a digit (e.g. `1.3.0-alpha-5` — what GitHub
            # UI release-create defaults to if the author omits the `v`).
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "Using tag version (unprefixed): $VERSION"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/maf-autopilot/maf-autopilot.csproj)
            echo "Using csproj version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Override version in csproj
        if: github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/maf-autopilot/maf-autopilot.csproj
          echo "Set csproj <Version> to $VERSION"

      - name: Restore
        run: dotnet restore maf-autopilot.sln

      - name: Test (solution-level — gates analyzer + main project)
        run: |
          dotnet test maf-autopilot.sln \
            --configuration Release \
            --no-restore \
            --logger "console;verbosity=minimal"

      - name: Pack server tool
        run: |
          dotnet pack src/maf-autopilot/maf-autopilot.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          echo "Packed: $(ls src/dist/*.nupkg)"

      - name: Pack analyzer package
        # NU5017 false-positive: the analyzer csproj uses `<None Include ... Pack="true">`
        # to ship the analyzer DLL under `analyzers/dotnet/cs/`. NuGet pack's heuristic
        # doesn't see that path and reports "no dependencies nor content" — fires as
        # an error on .NET SDK 10.0.300+ (Linux runner) but as a warning with exit 0
        # on 10.0.102 (Windows local). The nupkg IS produced correctly in both cases
        # (verified by `unzip -l` showing analyzers/dotnet/cs/*.dll present).
        # Workaround: tolerate the pack exit code; verify success by nupkg presence.
        shell: bash
        run: |
          set +e
          dotnet pack src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          PACK_EXIT=$?
          if ls src/dist/maf-autopilot.Analyzers*.nupkg >/dev/null 2>&1; then
            echo "Packed: $(ls src/dist/maf-autopilot.Analyzers*.nupkg)"
            exit 0
          fi
          echo "::error::Analyzer nupkg was not produced (pack exit code was $PACK_EXIT)"
          exit "$PACK_EXIT"

      - name: Publish to NuGet
        run: |
          dotnet nuget push src/dist/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        # Fire for both v-prefixed and unprefixed numeric tags. Skip on workflow_dispatch
        # (no tag ref) — in that case the user typically created the Release manually
        # via the GitHub UI before dispatching.
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/0') || startsWith(github.ref, 'refs/tags/1') || startsWith(github.ref, 'refs/tags/2') || startsWith(github.ref, 'refs/tags/3') || startsWith(github.ref, 'refs/tags/4') || startsWith(github.ref, 'refs/tags/5') || startsWith(github.ref, 'refs/tags/6') || startsWith(github.ref, 'refs/tags/7') || startsWith(github.ref, 'refs/tags/8') || startsWith(github.ref, 'refs/tags/9')
        # SHA-pinned to softprops/action-gh-release v2.2.1 (2025-01-23) per supply-chain
        # hardening: a major-tag pin would let the maintainer's compromised account push
        # arbitrary code into our release workflow with NUGET_API_KEY in scope.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: src/dist/*.nupkg
          generate_release_notes: true
