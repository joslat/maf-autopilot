name: Release maf-autopilot

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.3.0-tool.2). Leave blank to use version in csproj.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using input version: $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using tag version: $VERSION"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/maf-autopilot/maf-autopilot.csproj)
            echo "Using csproj version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Override version in csproj
        if: github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/maf-autopilot/maf-autopilot.csproj
          echo "Set csproj <Version> to $VERSION"

      - name: Restore
        run: dotnet restore maf-autopilot.sln

      - name: Test (solution-level — gates analyzer + main project)
        run: |
          dotnet test maf-autopilot.sln \
            --configuration Release \
            --no-restore \
            --logger "console;verbosity=minimal"

      - name: Pack server tool
        run: |
          dotnet pack src/maf-autopilot/maf-autopilot.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          echo "Packed: $(ls src/dist/*.nupkg)"

      - name: Pack analyzer package
        run: |
          dotnet pack src/maf-autopilot.Analyzers/maf-autopilot.Analyzers.csproj \
            --configuration Release \
            --no-restore \
            --output src/dist/
          echo "Packed: $(ls src/dist/maf-autopilot.Analyzers*.nupkg)"

      - name: Publish to NuGet
        run: |
          dotnet nuget push src/dist/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # SHA-pinned to softprops/action-gh-release v2.2.1 (2025-01-23) per supply-chain
        # hardening: a major-tag pin would let the maintainer's compromised account push
        # arbitrary code into our release workflow with NUGET_API_KEY in scope.
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: src/dist/*.nupkg
          generate_release_notes: true
