name: Publish Docker image to GHCR

# Companion to release.yml — when a v* tag is pushed (or manually triggered),
# build the MCP server container and push to ghcr.io/<owner>/maf-autopilot.
#
# Image tags emitted:
#   - <version>           e.g. 1.3.0-alpha-5
#   - <major>.<minor>     e.g. 1.3
#   - <major>             e.g. 1
#   - latest              (only for non-prerelease versions)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. 1.3.0-alpha-5). Leave blank to use the latest git tag.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Phase 3.1 — validate workflow_dispatch input BEFORE any privileged step.
  # The build-and-push job has `packages: write` on GHCR.
  validate-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate version input shape
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT" ]; then
            echo "No version input — will use git tag"
            exit 0
          fi
          if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version input shape: $INPUT (must be semver)"
            exit 1
          fi

  build-and-push:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Determine version
        id: version
        # Phase 3.2 — read input via env: redirect; reference $INPUT_VERSION
        # as a shell variable. Eliminates template-injection surface.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "❌ No version supplied and no v* tag — aborting."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Mark prereleases — they don't get the `latest` tag.
          if echo "$VERSION" | grep -qE '\-(alpha|beta|rc|preview)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Building image for version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image summary
        # Phase 7.G fixup — env-redirect `steps.*.outputs.*` so the run: block
        # contains no template substitutions. `env.*` references inside another
        # `env:` block are valid GitHub Actions syntax (the runner resolves them
        # before the shell sees the value).
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          PULL_URL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          echo "## 🐳 Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${PULL_URL}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
