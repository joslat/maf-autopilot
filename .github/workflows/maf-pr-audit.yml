name: MAF PR Audit

# PR-time check: run every MAF scanner scoped to the changed *.cs files,
# post the report as a PR comment. The CI integration vector for plan #52.

on:
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch ref to compute the diff.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Net8 LTS — install-only; nupkg multi-targets so any flavor works.
          dotnet-version: '8.0.x'

      - name: Install maf-autopilot (prerelease)
        run: dotnet tool install --global maf-autopilot --prerelease || dotnet tool update --global maf-autopilot --prerelease

      - name: Run MCP server and call MafAuditPullRequest
        id: audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The MCP tool needs the base branch fetched locally as a branch ref.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true

          # Capture stdout AND stderr — older alpha versions of maf-autopilot may not
          # have the `doctor` CLI subcommand and fall back to MCP-server mode (which
          # writes its banner to stderr). `|| true` keeps the job alive on any error
          # so we still post a sticky comment with diagnostic content.
          maf-autopilot doctor "$GITHUB_WORKSPACE" > pr-audit-full.md 2>&1 || true

          # Defensive fallback: if the doctor invocation produced nothing (empty
          # file), write an explanatory message. Pre-alpha-4 NuGet builds didn't
          # have the doctor CLI as a subcommand — `maf-autopilot doctor` falls
          # into MCP-server-startup mode and exits cleanly with no useful output.
          # The marocchino sticky-comment action errors with "Either message or
          # path input is required" if the path resolves to an empty file.
          if [ ! -s pr-audit-full.md ]; then
            cat > pr-audit-full.md <<'EOF'
          ⚠️ **maf-autopilot doctor produced no output.**

          Likely cause: the installed `maf-autopilot` NuGet (current latest prerelease) is older than the `doctor` CLI subcommand. Once `1.3.0-alpha-4` or newer ships, this audit will produce a full report.

          Until then, you can run `maf-autopilot doctor .` locally after `dotnet tool install -g maf-autopilot --prerelease` to see the per-file findings.
          EOF
          fi

          echo "Full doctor report:"
          cat pr-audit-full.md

      - name: Comment on PR
        # SHA-pinned per supply-chain hardening. Verify against tag with:
        #   gh api repos/marocchino/sticky-pull-request-comment/git/refs/tags/v2.9.2 --jq .object.sha
        # Update via Dependabot (.github/dependabot.yml).
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728  # v2.9.2
        with:
          header: maf-autopilot-audit
          path: pr-audit-full.md
