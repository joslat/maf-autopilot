name: MAF PR Audit

# PR-time check: run every MAF scanner scoped to the changed *.cs files,
# post the report as a PR comment. The CI integration vector for plan #52.

on:
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Need the base branch ref to compute the diff.
          fetch-depth: 0

      - name: Decide whether to audit (skip if only samples/ changed)
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # samples/ intentionally contains buggy / out-of-date code:
          # - samples/find-the-bug/* has an answer-key.md alongside
          #   intentional anti-patterns (the tutorial IS the point).
          # - samples/maf-1.2-sample/* is the analyzer's test corpus —
          #   patterns valid in MAF 1.2 that later versions flag.
          # Auditing them produces a noisy F grade that doesn't reflect
          # the toolkit's code quality. Skip if EVERY changed code file
          # is under samples/.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true
          CHANGED_CODE=$(git diff --name-only "origin/$BASE_REF" HEAD | grep -E '\.(cs|csproj)$' || true)
          NON_SAMPLE=$(echo "$CHANGED_CODE" | grep -v '^samples/' || true)
          echo "Changed .cs/.csproj files in PR:"
          echo "$CHANGED_CODE" | sed 's/^/  /'
          if [ -z "$NON_SAMPLE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice title=MAF audit skipped::Only samples/ files changed — they're intentionally buggy demo corpora, not real code to audit."
            exit 0
          fi

          # Phase 5.11 (G6 in the hardening plan) — compiler-bomb cap.
          # A malicious PR can submit a small number of .cs files that each
          # exceed several MB (deeply-nested generics, multi-MB attributes,
          # giant XML doc comments) and pin Roslyn-host memory on the runner.
          # Cap the audit at: ≤ 200 changed .cs files AND ≤ 5 MB aggregate.
          # Above either ceiling, skip the Roslyn-heavy audit and surface a
          # warning — the PR can still merge, just without the per-file scan.
          CHANGED_CS=$(echo "$CHANGED_CODE" | grep -E '\.cs$' || true)
          if [ -n "$CHANGED_CS" ]; then
            COUNT=$(echo "$CHANGED_CS" | wc -l | tr -d ' ')
            # Sum the byte sizes of the changed files that currently exist on
            # disk. Renamed/deleted files contribute 0 (acceptable — we only
            # care about the post-image the audit would parse).
            TOTAL_BYTES=$(echo "$CHANGED_CS" \
              | xargs -I {} sh -c 'wc -c < "{}" 2>/dev/null || true' \
              | awk '{ s += $1 } END { print s+0 }')
            echo "Compiler-bomb cap check: $COUNT .cs files, $TOTAL_BYTES bytes total."
            if [ "$COUNT" -gt 200 ] || [ "$TOTAL_BYTES" -gt 5242880 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "::warning title=MAF audit skipped (compiler-bomb cap)::PR changes $COUNT .cs files / $TOTAL_BYTES bytes. Caps are 200 files / 5 MB. Roslyn-heavy audit skipped to protect the runner; CI-side scanners still run."
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Install maf-autopilot (prerelease)
        if: steps.scope.outputs.skip != 'true'
        run: dotnet tool install --global maf-autopilot --prerelease || dotnet tool update --global maf-autopilot --prerelease

      - name: Run MCP server and call MafAuditPullRequest
        if: steps.scope.outputs.skip != 'true'
        id: audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The MCP tool needs the base branch fetched locally as a branch ref.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true

          # Capture stdout AND stderr — older alpha versions of maf-autopilot may not
          # have the `doctor` CLI subcommand and fall back to MCP-server mode (which
          # writes its banner to stderr). `|| true` keeps the job alive on any error
          # so we still post a sticky comment with diagnostic content.
          maf-autopilot doctor "$GITHUB_WORKSPACE" > pr-audit-full.md 2>&1 || true

          # Defensive fallback: if the doctor invocation produced nothing (empty
          # file), write an explanatory message. Pre-alpha-4 NuGet builds didn't
          # have the doctor CLI as a subcommand — `maf-autopilot doctor` falls
          # into MCP-server-startup mode and exits cleanly with no useful output.
          # The marocchino sticky-comment action errors with "Either message or
          # path input is required" if the path resolves to an empty file.
          if [ ! -s pr-audit-full.md ]; then
            cat > pr-audit-full.md <<'EOF'
          ⚠️ **maf-autopilot doctor produced no output.**

          Likely cause: the installed `maf-autopilot` NuGet (current latest prerelease) is older than the `doctor` CLI subcommand. Once `1.3.0-alpha-4` or newer ships, this audit will produce a full report.

          Until then, you can run `maf-autopilot doctor .` locally after `dotnet tool install -g maf-autopilot --prerelease` to see the per-file findings.
          EOF
          fi

          echo "Full doctor report:"
          cat pr-audit-full.md

      - name: Comment on PR
        if: steps.scope.outputs.skip != 'true'
        # SHA-pinned per supply-chain hardening. Verify against tag with:
        #   gh api repos/marocchino/sticky-pull-request-comment/git/refs/tags/v2.9.2 --jq .object.sha
        # Update via Dependabot (.github/dependabot.yml).
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v2.9.2
        with:
          header: maf-autopilot-audit
          path: pr-audit-full.md
