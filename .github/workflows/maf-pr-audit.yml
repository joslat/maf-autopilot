name: MAF PR Audit

# PR-time check: run the MAF doctor over the repo (PRODUCT code — samples/ and
# test fixtures excluded, like the drift detector) and post the report as a
# sticky PR comment. The changed-file list is used only for the skip / compiler-
# bomb gate below, NOT to scope the scan — this is a whole-repo (product) audit.
# The CI integration vector for plan #52. [task 4.10]

on:
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'

# #148 finding 3 — this job runs Roslyn analysis over the PR's own (possibly
# untrusted, fork-supplied) source, so it must never hold write-scoped
# permissions. GitHub already enforces that for `pull_request` runs from a
# fork (GITHUB_TOKEN is force-downgraded to read-only regardless of what's
# declared here) — declaring only `contents: read` makes the same constraint
# explicit for same-repo PRs too. Posting the actual PR comment is handled by
# the companion workflow maf-pr-audit-comment.yml (triggered by workflow_run),
# which runs in the base repo's context with a normal write-scoped token and
# never touches fork-supplied code — only the plain markdown artifact this
# job produces below.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Need the base branch ref to compute the diff.
          fetch-depth: 0

      - name: Decide whether to audit (skip if only samples/ changed)
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # samples/ intentionally contains buggy / out-of-date code:
          # - samples/find-the-bug/* has an answer-key.md alongside
          #   intentional anti-patterns (the tutorial IS the point).
          # - samples/maf-1.2-sample/* is the analyzer's test corpus —
          #   patterns valid in MAF 1.2 that later versions flag.
          # Auditing them produces a noisy F grade that doesn't reflect
          # the toolkit's code quality. Skip if EVERY changed code file
          # is under samples/.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true
          CHANGED_CODE=$(git diff --name-only "origin/$BASE_REF" HEAD | grep -E '\.(cs|csproj)$' || true)
          NON_SAMPLE=$(echo "$CHANGED_CODE" | grep -v '^samples/' || true)
          echo "Changed .cs/.csproj files in PR:"
          echo "$CHANGED_CODE" | sed 's/^/  /'
          if [ -z "$NON_SAMPLE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice title=MAF audit skipped::Only samples/ files changed — they're intentionally buggy demo corpora, not real code to audit."
            exit 0
          fi

          # Phase 5.11 (G6 in the hardening plan) — compiler-bomb cap.
          # A malicious PR can submit a small number of .cs files that each
          # exceed several MB (deeply-nested generics, multi-MB attributes,
          # giant XML doc comments) and pin Roslyn-host memory on the runner.
          # Cap the audit at: ≤ 200 changed .cs files AND ≤ 5 MB aggregate.
          # Above either ceiling, skip the Roslyn-heavy audit and surface a
          # warning — the PR can still merge, just without the per-file scan.
          #
          # Phase 5.G fixup — use NUL-separated `git diff -z` + `xargs -0` to
          # handle filenames containing newlines / quotes / spaces (all legal
          # on POSIX). The prior `xargs -I {} sh -c '... "{}"'` form is
          # broken by a filename containing `"` (legal on Linux/macOS).
          # We re-fetch the changed file list as NUL-separated bytes instead
          # of parsing the already-newline-split list.
          mapfile -d '' CHANGED_NUL < <(git diff -z --name-only "origin/$BASE_REF" HEAD -- '*.cs')
          COUNT=${#CHANGED_NUL[@]}
          # Strip trailing empty entry that mapfile may add on a NUL-terminated input.
          if [ "$COUNT" -gt 0 ] && [ -z "${CHANGED_NUL[$((COUNT-1))]}" ]; then
            unset 'CHANGED_NUL[$((COUNT-1))]'
            COUNT=${#CHANGED_NUL[@]}
          fi

          if [ "$COUNT" -gt 0 ]; then
            TOTAL_BYTES=0
            for f in "${CHANGED_NUL[@]}"; do
              if [ -f "$f" ]; then
                # `stat -c %s --` is POSIX-friendly and never re-interprets the
                # filename through a shell parser.
                SZ=$(stat -c %s -- "$f" 2>/dev/null || echo 0)
                TOTAL_BYTES=$((TOTAL_BYTES + SZ))
              fi
            done
            echo "Compiler-bomb cap check: $COUNT .cs files, $TOTAL_BYTES bytes total."
            if [ "$COUNT" -gt 200 ] || [ "$TOTAL_BYTES" -gt 5242880 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "::warning title=MAF audit skipped (compiler-bomb cap)::PR changes $COUNT .cs files / $TOTAL_BYTES bytes. Caps are 200 files / 5 MB. Roslyn-heavy audit skipped to protect the runner; CI-side scanners still run."
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Install maf-autopilot (prerelease)
        if: steps.scope.outputs.skip != 'true'
        run: dotnet tool install --global maf-doctor --prerelease || dotnet tool update --global maf-doctor --prerelease

      - name: Run MCP server and call MafAuditPullRequest
        if: steps.scope.outputs.skip != 'true'
        id: audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The MCP tool needs the base branch fetched locally as a branch ref.
          git fetch origin "$BASE_REF":"refs/heads/$BASE_REF" --depth=50 || true

          # Capture stdout AND stderr — older alpha versions of maf-autopilot may not
          # have the `doctor` CLI subcommand and fall back to MCP-server mode (which
          # writes its banner to stderr). `|| true` keeps the job alive on any error
          # so we still post a sticky comment with diagnostic content.
          # Product-scoped (task 4.10 / 3.1): exclude samples/ + test fixtures so
          # the audit reflects product code, matching the drift detector. Older
          # published builds ignore the extra --exclude args (forward-compatible).
          maf-doctor doctor "$GITHUB_WORKSPACE" \
            --exclude samples/ --exclude .Tests/ --exclude find-the-bug/ \
            > pr-audit-full.md 2>&1 || true

          # Defensive fallback: if the doctor invocation produced nothing (empty
          # file), write an explanatory message. Pre-alpha-4 NuGet builds didn't
          # have the doctor CLI as a subcommand — `maf-doctor doctor` falls
          # into MCP-server-startup mode and exits cleanly with no useful output.
          # The marocchino sticky-comment action errors with "Either message or
          # path input is required" if the path resolves to an empty file.
          if [ ! -s pr-audit-full.md ]; then
            cat > pr-audit-full.md <<'EOF'
          ⚠️ **maf-doctor doctor produced no output.**

          Likely cause: the installed `maf-autopilot` NuGet (current latest prerelease) is older than the `doctor` CLI subcommand. Once `1.3.0-alpha-4` or newer ships, this audit will produce a full report.

          Until then, you can run `maf-doctor doctor .` locally after `dotnet tool install -g maf-doctor --prerelease` to see the per-file findings.
          EOF
          fi

          echo "Full doctor report:"
          cat pr-audit-full.md

      - name: Write skip placeholder (when the audit was intentionally skipped)
        if: steps.scope.outputs.skip == 'true'
        # The "Run MCP server..." step above never runs in this branch, so
        # pr-audit-full.md wouldn't otherwise exist — an artifact must still be
        # produced so the companion workflow can tell "intentionally skipped"
        # apart from "something actually went wrong" (#148 finding 3 review).
        run: |
          echo "ℹ️ **MAF audit skipped for this PR.** See this workflow run's annotations for why (only samples/ changed, or the diff exceeded the compiler-bomb cap — CI-side scanners still ran)." > pr-audit-full.md

      - name: Record PR number for the comment workflow
        # No `if:` guard — runs whenever the job reaches this point without an
        # earlier step failing (the implicit default), covering BOTH the
        # skip=true and skip=false success paths so an artifact is always
        # produced for a successful run. workflow_run's `pull_requests` context
        # is empty for fork PRs (a known GitHub Actions limitation) — hand the
        # PR number to the companion workflow explicitly via the artifact
        # instead of relying on it.
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload audit result
        # #148 finding 3 — this job's GITHUB_TOKEN is read-only (enforced by
        # GitHub for fork PRs regardless of the `permissions:` above), so it
        # cannot post the sticky comment itself. maf-pr-audit-comment.yml
        # (workflow_run) downloads this artifact and posts it instead. Always
        # uploading (skip or not) means a successful run of THIS workflow
        # guarantees the artifact exists — the companion workflow can then
        # treat a download failure as a genuine problem instead of having to
        # guess whether it's the expected "audit was skipped" case.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-audit-result
          path: |
            pr-audit-full.md
            pr-number.txt
          retention-days: 1
