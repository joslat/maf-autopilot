  - id: MAF130-INSTRUCTIONS-001
    package: Microsoft.Agents.AI
    version_introduced: "1.3.0"
    applies_to_codebases: "pre-1.3.0"   # Phase T correction (2026-05-13)
    type: Microsoft.Agents.AI.ChatClientAgentOptions
    method: Instructions
    obsolete_signature: "new ChatClientAgentOptions { Instructions = \"...\" }  (NOTE: REMOVED on 1.3.0+, see notes)"
    replacement_signature: "new ChatClientAgentOptions { ChatOptions = new() { Instructions = \"...\" } }"
    argument_order_change: false
    fix_description: "Pre-1.3.0 codebases assigned Instructions at the top of ChatClientAgentOptions. In 1.3.0 GA that property was REMOVED outright (not just deprecated). The replacement is to nest Instructions inside ChatOptions. Customer code that compiled against an earlier minor will fail to compile against 1.3.0 with CS0117 (member not found)."
    example_before: |
      // Pre-1.3.0 pattern (top-level Instructions — gone in 1.3.0):
      var agent = new ChatClientAgent(client, new ChatClientAgentOptions
      {
          Name = "Bot",
          Instructions = "You are helpful.",
      });
    example_after: |
      // 1.3.0+ pattern (Instructions nested in ChatOptions):
      var agent = new ChatClientAgent(client, new ChatClientAgentOptions
      {
          Name = "Bot",
          ChatOptions = new ChatOptions
          {
              Instructions = "You are helpful.",
          },
      });
    cs_warning: RUNTIME_SILENT
    guide_section: "4"
    dotnet_inspect_detectable: false
    notes: >
      **Phase T correction (2026-05-13):** the original entry described top-level Instructions
      as "silently ignored in 1.3.0" — implying the property still compiles but is ignored at
      runtime. Reality (verified via dotnet-inspect against ChatClientAgentOptions on the 1.3.0
      assembly): the Instructions property was REMOVED outright by 1.3.0 GA. Only the nested
      ChatOptions.Instructions property exists. Customer code referencing the top-level form
      will fail to compile with CS0117 (member not found), not produce a silent runtime bug.
      The cs_warning field stays RUNTIME_SILENT because the registry matcher uses it to
      categorise the bug class for tooling that scans pre-1.3 sources — the actual diagnostic
      on a 1.3.0 build is CS0117. This entry should be applied during a pre-1.3 -> 1.3
      migration; it cannot fire on a codebase that already targets 1.3.0 (it wouldn't compile).

  - id: MAF130-EXEC-002
    package: Microsoft.Agents.AI.Workflows
    version_introduced: "1.3.0"
    type: Microsoft.Agents.AI.Workflows.Executor
    method: "(class declaration)"
    obsolete_signature: "public class MyExecutor : Executor { ... }"
    replacement_signature: "public sealed partial class MyExecutor : Executor { ... }"
    argument_order_change: false
    fix_description: "Executor classes MUST be declared `sealed partial` so the source generator can emit the dispatcher partial. Missing the modifiers causes compile errors at generator-time, NOT at usage-time — easy to miss in casual review."
    example_before: |
      public class MyExecutor : Executor
      {
          [MessageHandler]
          public Task<string> Handle(int input) => ...;
      }
    example_after: |
      public sealed partial class MyExecutor : Executor
      {
          [MessageHandler]
          public Task<string> Handle(int input) => ...;
      }
    cs_warning: CS0246
    guide_section: "15"
    dotnet_inspect_detectable: false
    notes: >
      Requires Microsoft.Agents.AI.Workflows.Generators 1.3.0 to be installed. The source
      generator emits a partial class with the message-dispatch logic; without `partial` the
      generator output cannot be merged. Without `sealed` the generator emits a warning.

  - id: MAF130-MIDDLEWARE-001
    package: Microsoft.Extensions.AI
    version_introduced: "1.3.0"
    type: Microsoft.Extensions.AI.ChatClientBuilder
    method: Use
    obsolete_signature: ".Use(<runFunc>, null)  // streaming branch null => silent bypass"
    replacement_signature: ".Use(<runFunc>, <runStreamingFunc>)  // both branches wired"
    argument_order_change: false
    fix_description: "When using `.AsBuilder().Use(...)` with the two-Func middleware overload, BOTH the non-streaming AND streaming callbacks must be provided. Passing null for the streaming Func means any RunStreamingAsync invocation silently bypasses your middleware. Note: the overload uses POSITIONAL parameters (no named `runFunc:` / `runStreamingFunc:` argument names on the real ChatClientBuilder.Use surface)."
    example_before: |
      // Anti-pattern: streaming branch is null, so RunStreamingAsync bypasses this middleware.
      chatClient.AsBuilder()
          .Use(
              async (messages, options, next, ct) =>
                  await next.GetResponseAsync(messages, options, ct),
              null /* streaming branch missing */)
          .Build();
    example_after: |
      // Correct: both branches handled.
      chatClient.AsBuilder()
          .Use(
              async (messages, options, next, ct) =>
                  await next.GetResponseAsync(messages, options, ct),
              (messages, options, next, ct) =>
                  next.GetStreamingResponseAsync(messages, options, ct))
          .Build();
    cs_warning: RUNTIME_SILENT
    guide_section: "8"
    dotnet_inspect_detectable: false
    notes: >
      Same silent-bypass class as fan-in starvation: builds clean, runs clean for non-streaming
      calls, but any RunStreamingAsync invocation flows around your middleware as if it weren't
      there. Easy to miss in casual review.

      **Phase T correction (2026-05-13):** original examples used named arguments `runFunc:` /
      `runStreamingFunc:` — those parameter names do NOT match the real
      `ChatClientBuilder.Use(Func, Func)` surface (verified via dotnet-inspect against the
      Microsoft.Extensions.AI 10.5.0 assembly). Code following the registry's prior examples
      verbatim would fail to compile with CS1739 ("no parameter named 'runFunc'"). Examples
      now use positional arguments only.

